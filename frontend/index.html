<html lang="en">

  <script src="/static/react.min.js"></script>
  <script src="/static/react-dom.min.js"></script>

  <script src="/static/recharts.min.js"></script>

    .input{width:100%;border:1px solid #c4b5fd;border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;outline:none;background:#fff;color:#1a0030;font-family:'Poppins',sans-serif}
    .input:focus{border-color:#4B006E;box-shadow:0 0 0 2px rgba(75,0,110,.2)}
    .label{display:block;font-size:.875rem;font-weight:500;color:#3b0764;margin-bottom:.25rem}
    .btn{padding:.5rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;cursor:pointer;border:none;transition:background .15s;font-family:'Poppins',sans-serif}
    .btn-primary{background:#4B006E;color:#fff}.btn-primary:hover{background:#3b0057}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .btn-secondary{background:#fff;color:#3b0764;border:1px solid #c4b5fd}.btn-secondary:hover{background:#f5f3f8}
    .btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
    .badge{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.75rem;font-weight:500}
    .tbl{width:100%;font-size:.875rem;border-collapse:collapse}
    .tbl th{background:#f5f3f8;text-align:left;font-size:.75rem;font-weight:600;color:#6b21a8;text-transform:uppercase;letter-spacing:.05em;padding:.75rem 1rem;white-space:nowrap}
    .tbl td{padding:.5rem 1rem;border-bottom:1px solid #ede9fe}
    .tbl tr:hover td{background:#faf5ff}
    .status-done{background:#d1fae5;color:#065f46;display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.75rem;font-weight:500}
    .status-pending{background:#fef3c7;color:#92400e;display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.75rem;font-weight:500}
    .status-call-again{background:#dbeafe;color:#1e40af;display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.75rem;font-weight:500}
    .toast-wrap{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
    .toast{padding:.75rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;animation:fadeIn .3s;max-width:24rem}
    .toast-success{background:#4B006E;color:#e9d5ff}
    .toast-error{background:#991b1b;color:#fee2e2}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-.5rem)}to{opacity:1;transform:translateY(0)}}
    .modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:1rem}
    .modal-box{background:#fff;border-radius:1rem;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-height:90vh;overflow-y:auto}
    .modal-hd{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid #e9d5ff}

    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}

    .gauge-fill{height:100%;border-radius:9999px;transition:width .3s}
    select.input{-webkit-appearance:auto;appearance:auto}
    textarea.input{resize:vertical}
    a{color:inherit;text-decoration:none}

<body>
<div id="root"></div>
<script>
const {createElement:h,useState,useEffect,useCallback,createContext,useContext,useRef,Fragment} = React;
const {BarChart,Bar,XAxis,YAxis,Tooltip,ResponsiveContainer,PieChart,Pie,Cell,Legend} = Recharts;

const API_BASE = '';  // same-origin, no prefix needed
const COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];

// ── Toast ──────────────────────────────────────────────────────────────────────
function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  window._showToast = (msg, type='success') => {
    const id = Date.now();
    setToasts(t => [...t, {id,msg,type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  };
  return h('div',{className:'toast-wrap'},
    toasts.map(t => h('div',{key:t.id,className:`toast toast-${t.type}`},t.msg))
  );
}
const toast = {
  success: m => window._showToast?.(m,'success'),
  error:   m => window._showToast?.(m,'error'),
};

// ── Auth ───────────────────────────────────────────────────────────────────────
const AuthCtx = createContext(null);
function AuthProvider({children}) {
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } });
  const apiFetch = useCallback(async (path, opts={}) => {
    const token = localStorage.getItem('token');
    const isForm = opts.body instanceof FormData;
    const headers = isForm ? {} : {'Content-Type':'application/json'};
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch('/api' + path, {...opts, headers:{...headers,...(opts.headers||{})}});
    if (res.status === 401) { localStorage.clear(); setUser(null); navigate('/login'); }
    const data = await res.json();
    if (!res.ok) throw {response:{data}};
    return data;
  }, []);
  const login = async (email, password) => {
    const data = await apiFetch('/auth/login', {method:'POST', body:JSON.stringify({email,password})});
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    setUser(data.user); return data.user;
  };
  const register = async (form) => {
    const data = await apiFetch('/auth/register', {method:'POST', body:JSON.stringify(form)});
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    setUser(data.user); return data.user;
  };
  const logout = () => { localStorage.clear(); setUser(null); };
  const refreshUser = async () => {
    try { const u = await apiFetch('/users/me'); localStorage.setItem('user',JSON.stringify(u)); setUser(u); } catch {}
  };
  return h(AuthCtx.Provider, {value:{user,login,register,logout,refreshUser,apiFetch}}, children);
}
const useAuth = () => useContext(AuthCtx);

// ── Router ─────────────────────────────────────────────────────────────────────
function useRoute() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  useEffect(() => {
    const h = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', h);
    return () => window.removeEventListener('hashchange', h);
  }, []);
  return hash.replace('#','') || '/';
}
const navigate = path => { window.location.hash = '#' + path; };

// ── Helpers ────────────────────────────────────────────────────────────────────
const el = (tag, props, ...kids) => h(tag, props, ...kids);
const inp = (val, onChange, extra={}) => h('input', {className:'input', value:val, onChange:e=>onChange(e.target.value), ...extra});
const sel = (val, onChange, opts, extra={}) => h('select', {className:'input', value:val, onChange:e=>onChange(e.target.value), ...extra},
  opts.map(([v,l]) => h('option',{key:v,value:v},l||v))
);
const btn = (label, onClick, cls='btn btn-primary', extra={}) => h('button',{className:cls,onClick,...extra},label);
const lbl = txt => h('label',{className:'label'},txt);
const fld = (label, child) => h('div',null, lbl(label), child);

function Modal({open, onClose, title, children, maxWidth='36rem'}) {
  if (!open) return null;
  return h('div',{className:'modal-bg',onClick:e=>e.target===e.currentTarget&&onClose()},
    h('div',{className:'modal-box',style:{maxWidth}},
      h('div',{className:'modal-hd'},
        h('h2',{style:{fontSize:'1.125rem',fontWeight:600}},title),
        h('button',{onClick:onClose,style:{background:'none',border:'none',fontSize:'1.5rem',cursor:'pointer',color:'#94a3b8',lineHeight:1}},'×')
      ),
      h('div',{className:'modal-bd'},children)
    )
  );
}

function StatusBadge({status}) {
  const cls = status==='Done' ? 'status-done' : status==='Pending' ? 'status-pending' : 'status-call-again';
  return h('span',{className:cls},status);
}

function Gauge({label, val, max}) {
  const pct = max > 0 ? Math.min(100,(val/max)*100) : 0;
  const col = pct>=100?'#10b981':pct>=75?'#3b82f6':pct>=50?'#f59e0b':'#ef4444';
  return h('div',{className:'gauge-wrap'},
    h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.75rem',color:'#64748b',marginBottom:'.375rem'}},
      h('span',null,label), h('span',{style:{fontWeight:600}},pct.toFixed(1)+'%')
    ),
    h('div',{className:'gauge-bar'},h('div',{className:'gauge-fill',style:{width:`${pct}%`,background:col}})),
    h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.75rem',color:'#94a3b8',marginTop:'.25rem'}},
      h('span',null,'₱'+Number(val).toLocaleString()), h('span',null,'₱'+Number(max).toLocaleString())
    )
  );
}

  return h('div',{style:{minHeight:'100vh',background:'linear-gradient(135deg,#4B006E,#2d0042,#1a0030)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'#fff',padding:'2rem'}},

// ── Login ──────────────────────────────────────────────────────────────────────
function Login() {
  const {login} = useAuth();
  const [email,setEmail] = useState('');
  const [pass,setPass] = useState('');
  const [loading,setLoading] = useState(false);
  const submit = async e => {
    e.preventDefault(); setLoading(true);
    try { await login(email,pass); toast.success('Welcome back!'); navigate('/dashboard'); }
    catch(err) { toast.error(err?.response?.data?.error||'Login failed'); }
    finally { setLoading(false); }
  };
  return h('div',{style:{minHeight:'100vh',display:'flex',fontFamily:"'Poppins',sans-serif"}},
    // ── Left panel ──
    h('div',{style:{flex:'1',background:'linear-gradient(160deg,#4B006E 0%,#2d0042 60%,#1a0030 100%)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'3rem',color:'#fff',position:'relative',overflow:'hidden'}},

      h('div',{style:{position:'absolute',top:'-4rem',right:'-4rem',width:'18rem',height:'18rem',borderRadius:'50%',background:'rgba(255,255,255,.05)'}}),

      h('div',{style:{position:'relative',zIndex:1,textAlign:'center',maxWidth:'26rem'}},
        h('img',{src:'/static/logo.png',alt:'Sales Buddy 3.0',style:{height:'120px',borderRadius:'1.25rem',marginBottom:'2rem',boxShadow:'0 8px 32px rgba(0,0,0,.3)'}}),
        h('h2',{style:{fontSize:'1.75rem',fontWeight:700,marginBottom:'.75rem',lineHeight:1.3}},'Your sales command center'),
        h('p',{style:{fontSize:'.95rem',color:'rgba(255,255,255,.7)',lineHeight:1.7}},"Track leads, monitor targets, and manage activities for City Savings Bank's Salary and Pension Loans teams."),
        h('div',{style:{display:'flex',flexDirection:'column',gap:'.6rem',marginTop:'2rem',textAlign:'left'}},
          [['circle-check-big','Lead & activity tracking'],['bar-chart-2','Performance analytics'],['milestone','Branch target management']].map(([icon,txt],i)=>
            h('div',{key:i,style:{display:'flex',alignItems:'center',gap:'.75rem',fontSize:'.875rem',color:'rgba(255,255,255,.8)'}},
              Icon(icon,16,{color:'#e9d5ff',flexShrink:0}), txt
            )
          )

          ))),

            h('option',{value:''},'Select...'), filtB.map(b=>h('option',{key:b.branch_code,value:b.branch_code},b.branch_code))

function Activities() {
  const {user,apiFetch} = useAuth();

  const [form,setForm] = useState(initForm);
  const sf = k => v => setForm(f=>({...f,[k]:v}));
  const load = () => { const p=filterStatus?`?status=${filterStatus}`:''; apiFetch('/activities'+p).then(setActs).catch(console.error).finally(()=>setLoading(false)); };
  useEffect(load,[filterStatus]);

    ),

      h('table',{className:'tbl'},
        h('thead',null,h('tr',null,['ID','Customer','Type','Loan Status','Status','Duration','Notes','SA','Date','Actions'].map(c=>h('th',{key:c},c)))),
        h('tbody',null,
          loading?h('tr',null,h('td',{colSpan:10,style:{textAlign:'center',padding:'2.5rem',color:'#94a3b8'}},'Loading...'))
          :acts.length===0?h('tr',null,h('td',{colSpan:10,style:{textAlign:'center',padding:'2.5rem',color:'#94a3b8'}},'No activities found'))

            h('td',{style:{fontWeight:500}},a.client_name||a.customer_name),

            h('td',{style:{color:'#64748b',fontSize:'.8125rem'}},a.loan_status),
            h('td',null,h(StatusBadge,{status:a.activity_status})),
            h('td',{style:{color:'#94a3b8'}},a.duration),
            h('td',{style:{color:'#64748b',fontSize:'.8125rem',maxWidth:'150px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},a.sales_notes),
            h('td',{style:{color:'#94a3b8',fontSize:'.8125rem'}},a.sa_name),
            h('td',{style:{color:'#94a3b8',fontSize:'.8125rem'}},a.created_at?.slice(0,10)),
            h('td',null,h('div',{style:{display:'flex',gap:'.5rem'}},

          ))),

          fld('Activity Status *',h('select',{className:'input',value:form.activity_status,onChange:e=>sf('activity_status')(e.target.value)},ACT_ST.map(s=>h('option',{key:s},s)))),
          h('div',{className:'span2'},fld('Loan Status *',h('select',{className:'input',value:form.loan_status,onChange:e=>sf('loan_status')(e.target.value)},LOAN_ST.map(s=>h('option',{key:s},s))))),

// ── Calendar ───────────────────────────────────────────────────────────────────
function ActivityCalendar() {
  const {apiFetch} = useAuth();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const [year,setYear] = useState(today.getFullYear());
  const [month,setMonth] = useState(today.getMonth());
  const [acts,setActs] = useState([]);
  const [sel,setSel] = useState(null);
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  useEffect(()=>{ apiFetch('/activities').then(setActs).catch(()=>{}); },[]);
  const byDay = {};
  acts.forEach(a=>{ const d=a.created_at?.slice(0,10); if(d){if(!byDay[d])byDay[d]=[];byDay[d].push(a);} });
  const getDays=(y,m)=>{ const first=new Date(y,m,1),last=new Date(y,m+1,0),days=[]; for(let i=0;i<first.getDay();i++)days.push(null); for(let d=1;d<=last.getDate();d++)days.push(d); return days; };
  const days = getDays(year,month);
  return h('div',{style:{display:'flex',flexDirection:'column',gap:'1.25rem'}},
    h('h1',{style:{fontSize:'1.5rem',fontWeight:700,color:'#0f172a'}},'Activity Calendar'),
    h('div',{style:{display:'grid',gridTemplateColumns:'2fr 1fr',gap:'1.5rem'}},
      h('div',{className:'card'},
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1.25rem'}},
          h('button',{className:'btn btn-secondary',style:{padding:'.375rem .75rem'},onClick:()=>{if(month===0){setYear(y=>y-1);setMonth(11);}else setMonth(m=>m-1);}},'\u2190'),
          h('h2',{style:{fontSize:'1.125rem',fontWeight:600}},MN[month]+' '+year),
          h('button',{className:'btn btn-secondary',style:{padding:'.375rem .75rem'},onClick:()=>{if(month===11){setYear(y=>y+1);setMonth(0);}else setMonth(m=>m+1);}},'\u2192')
        ),
        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'2px',marginBottom:'.5rem'}},
          DN.map(d=>h('div',{key:d,style:{textAlign:'center',fontSize:'.75rem',fontWeight:600,color:'#94a3b8',padding:'.25rem'}},d))
        ),
        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'2px'}},
          days.map((day,i)=>{
            if(!day) return h('div',{key:i});
            const dStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const hasActs=byDay[dStr]?.length>0;
            const isToday=dStr===todayStr, isSel=dStr===sel;
            return h('button',{key:i,onClick:()=>setSel(dStr),style:{position:'relative',padding:'.5rem',borderRadius:'.5rem',fontSize:'.875rem',fontWeight:500,cursor:'pointer',border:'none',background:isSel?'#2563eb':isToday?'#eff6ff':'transparent',color:isSel?'#fff':isToday?'#1d4ed8':'#374151',textAlign:'center'}},
              day,
              hasActs&&h('span',{style:{position:'absolute',bottom:'2px',right:'3px',width:'6px',height:'6px',borderRadius:'50%',background:isSel?'#fff':'#3b82f6'}})
            );
          })
        )
      ),
      h('div',{className:'card'},
        h('h3',{style:{fontSize:'.9375rem',fontWeight:600,color:'#374151',marginBottom:'.75rem'}},sel?'Activities on '+sel:'Select a date'),
        !sel ? h('p',{style:{color:'#94a3b8',fontSize:'.875rem'}},'Click a date to see activities.')
        :(byDay[sel]||[]).length===0 ? h('p',{style:{color:'#94a3b8',fontSize:'.875rem'}},'No activities on this day.')
        :(byDay[sel]).map(a=>h('div',{key:a.id,style:{padding:'.75rem',background:'#f8fafc',borderRadius:'.625rem',marginBottom:'.5rem',fontSize:'.875rem'}},
          h('div',{style:{fontWeight:500,color:'#0f172a'}},a.client_name||a.customer_name),
          h('div',{style:{fontSize:'.8125rem',color:'#64748b'}},a.activity_type+' · '+a.activity_status),
          a.sales_notes&&h('div',{style:{fontSize:'.8125rem',color:'#94a3b8',marginTop:'.25rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},a.sales_notes)
        ))
      )
    )
  );
}

  useEffect(load,[]);
  const openNew = () => { setEditPromo(null); setForm({promo_agency:'DEPED',promo_name:'',date_start:'',date_end:'',description:'',changes_made:''}); setShowModal(true); };
  const openEdit = p => { setEditPromo(p); setForm({promo_agency:p.promo_agency,promo_name:p.promo_name,date_start:p.date_start,date_end:p.date_end,description:p.description||'',changes_made:''}); setShowModal(true); };
  const submit = async e => {
    e.preventDefault();
    try { if(editPromo) { await apiFetch(`/promos/${editPromo.id}`,{method:'PUT',body:JSON.stringify(form)}); toast.success('Updated!'); } else { await apiFetch('/promos',{method:'POST',body:JSON.stringify(form)}); toast.success('Created!'); } setShowModal(false); load(); }
    catch(err) { toast.error(err?.response?.data?.error||'Failed'); }
  };
  const del = async id => { if(!confirm('Delete?')) return; try { await apiFetch(`/promos/${id}`,{method:'DELETE'}); toast.success('Deleted'); load(); } catch { toast.error('Delete failed'); } };
  const isActive = p => new Date(p.date_end) >= new Date();
  return h('div',{style:{display:'flex',flexDirection:'column',gap:'1.25rem'}},
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
      h('div',null,h('h1',{style:{fontSize:'1.5rem',fontWeight:700,color:'#0f172a',marginBottom:'.25rem'}},'Promos'),h('p',{style:{color:'#64748b',fontSize:'.875rem'}},'Active and expired promotional offers')),
      user?.role==='Admin'&&h('button',{className:'btn btn-primary',onClick:openNew},'+ Create Promo')
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:'1rem'}},
      loading?h('div',{style:{textAlign:'center',padding:'2.5rem',color:'#94a3b8'}},'Loading...')
      :promos.length===0?h('div',{style:{textAlign:'center',padding:'2.5rem',color:'#94a3b8'}},'No promos available.')
      :promos.map(p=>h('div',{key:p.id,className:'card',style:{opacity:isActive(p)?1:0.6}},
        h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'.75rem'}},
          h('div',null,h('div',{style:{marginBottom:'.25rem'}},Icon('tag',22,{color:'#4B006E'})),h('div',{style:{fontWeight:600,color:'#0f172a'}},p.promo_name),h('div',{style:{fontFamily:'monospace',fontSize:'.8125rem',color:'#94a3b8'}},p.promo_id)),
          h('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'.25rem'}},
            h('span',{className:'badge',style:{background:isActive(p)?'#d1fae5':'#fee2e2',color:isActive(p)?'#065f46':'#991b1b'}},isActive(p)?'✅ Active':'❌ Expired'),
            h('span',{className:'badge',style:{background:'#eff6ff',color:'#1d4ed8'}},p.promo_agency)
          )
        ),
        h('p',{style:{fontSize:'.875rem',color:'#475569',marginBottom:'.75rem'}},p.description),
        h('div',{style:{fontSize:'.8125rem',color:'#94a3b8'}},h('div',null,'Start: ',h('span',{style:{color:'#374151',fontWeight:500}},p.date_start)),h('div',null,'End: ',h('span',{style:{color:'#374151',fontWeight:500}},p.date_end))),
        user?.role==='Admin'&&h('div',{style:{display:'flex',gap:'.5rem',marginTop:'.75rem',paddingTop:'.75rem',borderTop:'1px solid #f1f5f9'}},
          h('button',{className:'btn btn-secondary',style:{flex:1,fontSize:'.8125rem'},onClick:()=>openEdit(p)},'Edit'),
          h('button',{className:'btn btn-danger',style:{flex:1,fontSize:'.8125rem'},onClick:()=>del(p.id)},'Delete')
        )
      ))
    ),
    h(Modal,{open:showModal,onClose:()=>setShowModal(false),title:editPromo?'Edit Promo':'Create Promo'},
      h('form',{onSubmit:submit},
        h('div',{className:'grid2'},
          fld('Agency *',h('select',{className:'input',value:form.promo_agency,onChange:e=>sf('promo_agency')(e.target.value)},['DEPED','BEYOND_DEPED','PENSION'].map(a=>h('option',{key:a},a)))),
          fld('Promo Name *',inp(form.promo_name,sf('promo_name'),{required:true})),
          fld('Date Start *',inp(form.date_start,sf('date_start'),{type:'date',required:true})),
          fld('Date End *',inp(form.date_end,sf('date_end'),{type:'date',required:true})),
          h('div',{className:'span2'},fld('Description',h('textarea',{className:'input',rows:3,value:form.description,onChange:e=>sf('description')(e.target.value)}))),
          editPromo&&h('div',{className:'span2'},fld('Changes Made',inp(form.changes_made,sf('changes_made'),{placeholder:'What changed...'}))),
          h('div',{className:'span2',style:{display:'flex',gap:'.75rem'}},
            h('button',{className:'btn btn-primary',type:'submit',style:{flex:1}},editPromo?'Update':'Create'),
            h('button',{className:'btn btn-secondary',type:'button',style:{flex:1},onClick:()=>setShowModal(false)},'Cancel')
          )
        )
      )
    )
  );
}

// ── Users ──────────────────────────────────────────────────────────────────────
function Users() {
  const {user,apiFetch} = useAuth();
  const [users,setUsers] = useState([]);
  const [loading,setLoading] = useState(true);
  const [editUser,setEditUser] = useState(null);
  const [eForm,setEForm] = useState({});
  const [search,setSearch] = useState('');
  const load = () => apiFetch('/users').then(setUsers).catch(console.error).finally(()=>setLoading(false));
  useEffect(load,[]);
  const openEdit = u => { setEditUser(u); setEForm({full_name:u.full_name,role:u.role,agency:u.agency,region_name:u.region_name,branch_code:u.branch_code,branch_name:u.branch_name,reports_to:u.reports_to||''}); };
  const save = async () => {
    try { await apiFetch(`/users/${editUser.id}`,{method:'PUT',body:JSON.stringify(eForm)}); toast.success('Updated!'); setEditUser(null); load(); }
    catch(err) { toast.error(err?.response?.data?.error||'Failed'); }
  };
  const del = async id => { if(!confirm('Delete user?')) return; try { await apiFetch(`/users/${id}`,{method:'DELETE'}); toast.success('Deleted'); load(); } catch { toast.error('Delete failed'); } };
  const filtered = users.filter(u=>u.full_name?.toLowerCase().includes(search.toLowerCase())||u.email?.toLowerCase().includes(search.toLowerCase())||u.employee_id?.toLowerCase().includes(search.toLowerCase()));
  const RC = {SA:'#d1fae5 #065f46',ASH:'#dbeafe #1e40af',RSH:'#ede9fe #6d28d9',SH:'#ffedd5 #c2410c',Admin:'#fee2e2 #991b1b'};
  return h('div',{style:{display:'flex',flexDirection:'column',gap:'1.25rem'}},
    h('div',null,h('h1',{style:{fontSize:'1.5rem',fontWeight:700,color:'#0f172a',marginBottom:'.25rem'}},'Users'),h('p',{style:{color:'#64748b',fontSize:'.875rem'}},users.length+' registered users')),
    inp(search,setSearch,{placeholder:'Search name, email, ID...',style:{maxWidth:'280px'}}),
    h('div',{className:'card',style:{padding:0,overflow:'auto'}},
      h('table',{className:'tbl'},
        h('thead',null,h('tr',null,['Name','Email','Employee ID','Role','Agency','Branch','Region','Reports To',...(user?.role==='Admin'?['Actions']:[])].map(c=>h('th',{key:c},c)))),
        h('tbody',null,
          loading?h('tr',null,h('td',{colSpan:9,style:{textAlign:'center',padding:'2.5rem',color:'#94a3b8'}},'Loading...'))
          :filtered.length===0?h('tr',null,h('td',{colSpan:9,style:{textAlign:'center',padding:'2.5rem',color:'#94a3b8'}},'No users found'))
          :filtered.map(u=>{const [bg,tc]=(RC[u.role]||'#f1f5f9 #374151').split(' ');return h('tr',{key:u.id},
            h('td',{style:{fontWeight:500}},u.full_name),
            h('td',{style:{color:'#64748b',fontSize:'.8125rem'}},u.email),
            h('td',{style:{fontFamily:'monospace',fontSize:'.8125rem',color:'#64748b'}},u.employee_id),
            h('td',null,h('span',{className:'badge',style:{background:bg,color:tc}},u.role)),
            h('td',{style:{fontSize:'.8125rem',color:'#64748b'}},u.agency),
            h('td',{style:{fontSize:'.8125rem',color:'#64748b'}},u.branch_name),
            h('td',{style:{fontSize:'.8125rem',color:'#64748b'}},u.region_name),
            h('td',{style:{fontSize:'.8125rem',color:'#94a3b8'}},u.reports_to||'—'),
            user?.role==='Admin'&&h('td',null,h('div',{style:{display:'flex',gap:'.5rem'}},
              h('button',{style:{background:'none',border:'none',color:'#2563eb',cursor:'pointer',fontSize:'.8125rem',fontWeight:500},onClick:()=>openEdit(u)},'Edit'),
              h('button',{style:{background:'none',border:'none',color:'#dc2626',cursor:'pointer',fontSize:'.8125rem',fontWeight:500},onClick:()=>del(u.id)},'Del')
            ))
          );})
        )
      )
    ),
    h(Modal,{open:!!editUser,onClose:()=>setEditUser(null),title:'Edit: '+(editUser?.full_name||'')},
      editUser&&h('div',{style:{display:'flex',flexDirection:'column',gap:'.875rem'}},
        fld('Full Name',inp(eForm.full_name,v=>setEForm(f=>({...f,full_name:v})))),
        h('div',{className:'grid2'},
          fld('Role',h('select',{className:'input',value:eForm.role,onChange:e=>setEForm(f=>({...f,role:e.target.value}))},['SA','ASH','RSH','SH','Admin'].map(r=>h('option',{key:r},r)))),
          fld('Agency',h('select',{className:'input',value:eForm.agency,onChange:e=>setEForm(f=>({...f,agency:e.target.value}))},['DEPED','BEYOND_DEPED','PENSION','ALL'].map(a=>h('option',{key:a},a))))
        ),
        fld('Reports To',inp(eForm.reports_to,v=>setEForm(f=>({...f,reports_to:v})))),
        h('div',{style:{display:'flex',gap:'.75rem'}},
          h('button',{className:'btn btn-primary',style:{flex:1},onClick:save},'Save Changes'),
          h('button',{className:'btn btn-secondary',style:{flex:1},onClick:()=>setEditUser(null)},'Cancel')
        )
      )
    )
  );
}

// ── Profile ────────────────────────────────────────────────────────────────────
function Profile() {
  const {user,apiFetch,refreshUser} = useAuth();
  const [form,setForm] = useState({full_name:user?.full_name||'',reports_to:user?.reports_to||''});
  const [loading,setLoading] = useState(false);
  const RC={SA:'#d1fae5 #065f46',ASH:'#dbeafe #1e40af',RSH:'#ede9fe #6d28d9',SH:'#ffedd5 #c2410c',Admin:'#fee2e2 #991b1b'};
  const [bg,tc]=(RC[user?.role]||'#f1f5f9 #374151').split(' ');
  const save = async e => {
    e.preventDefault(); setLoading(true);
    try { await apiFetch('/users/me',{method:'PUT',body:JSON.stringify(form)}); await refreshUser(); toast.success('Profile updated!'); }
    catch(err) { toast.error(err?.response?.data?.error||'Failed'); }
    finally { setLoading(false); }
  };
  return h('div',{style:{maxWidth:'40rem'}},
    h('h1',{style:{fontSize:'1.5rem',fontWeight:700,color:'#0f172a',marginBottom:'1.25rem'}},'My Profile'),
    h('div',{className:'card'},
      h('div',{style:{display:'flex',alignItems:'center',gap:'1.25rem',marginBottom:'1.5rem',paddingBottom:'1.25rem',borderBottom:'1px solid #f1f5f9'}},
        h('div',{style:{width:'5rem',height:'5rem',borderRadius:'50%',background:'#2563eb',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:'2rem',fontWeight:700,flexShrink:0}},user?.full_name?.charAt(0)||'U'),
        h('div',null,
          h('h2',{style:{fontSize:'1.25rem',fontWeight:600,color:'#0f172a',marginBottom:'.25rem'}},user?.full_name),
          h('p',{style:{color:'#64748b',fontSize:'.875rem',marginBottom:'.5rem'}},user?.email),
          h('div',{style:{display:'flex',gap:'.5rem'}},h('span',{className:'badge',style:{background:bg,color:tc}},user?.role),h('span',{className:'badge',style:{background:'#f1f5f9',color:'#475569'}},user?.agency))
        )
      ),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem',marginBottom:'1.5rem',fontSize:'.875rem'}},
        [['Employee ID',user?.employee_id],['Branch',user?.branch_name],['Branch Code',user?.branch_code],['Region',user?.region_name],['Joined',user?.created_at?.slice(0,10)]].map(([k,v])=>
          h('div',{key:k},h('div',{style:{fontSize:'.75rem',color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:'.125rem'}},k),h('div',{style:{fontWeight:500,color:'#374151'}},v||'—'))
        )
      ),
      h('form',{onSubmit:save,style:{display:'flex',flexDirection:'column',gap:'.875rem',paddingTop:'1.25rem',borderTop:'1px solid #f1f5f9'}},
        h('h3',{style:{fontSize:'.9375rem',fontWeight:600,color:'#374151'}},'Edit Details'),
        fld('Full Name',inp(form.full_name,v=>setForm(f=>({...f,full_name:v})))),
        fld('Reporting To (Email)',inp(form.reports_to,v=>setForm(f=>({...f,reports_to:v})),{placeholder:'supervisor@csb.com'})),
        h('button',{className:'btn btn-primary',type:'submit',disabled:loading,style:{alignSelf:'flex-start',padding:'.625rem 1.5rem'}},loading?'Saving...':'Save Changes')
      ),
      h('div',{style:{marginTop:'1.25rem',padding:'.75rem',background:'#eff6ff',borderRadius:'.625rem',fontSize:'.8125rem',color:'#1e3a8a'}},
        h('strong',null,'⚠️ Important: '),'To correct your Employee ID, email, or role, contact your ASH.'
      )
    )
  );
}

// ── App Router ─────────────────────────────────────────────────────────────────
function AppContent() {
  const {user} = useAuth();
  const route = useRoute();
  if (!user) {
    if (route==='/register') return h(Register,null);
    if (route==='/login') return h(Login,null);
    if (route==='/') return h(Landing,null);
    return h(Login,null);
  }
  const getPage = () => {
    if (route==='/dashboard') return h(Dashboard,null);
    if (route==='/customers') return h(Customers,null);
    if (route.startsWith('/customers/')) return h(CustomerDetail,{id:route.split('/')[2]});
    if (route==='/activities') return h(Activities,null);
    if (route==='/calendar') return h(ActivityCalendar,null);
    if (route==='/targets') return h(Targets,null);
    if (route==='/target-shares') return h(TargetShares,null);
    if (route==='/daily-lr') return h(DailyLR,null);
    if (route==='/assign') return h(Assign,null);
    if (route==='/uploads') return h(Uploads,null);
    if (route==='/promos') return h(Promos,null);
    if (route==='/users') return h(Users,null);
    if (route==='/profile') return h(Profile,null);
    return h(Dashboard,null);
  };
  return h(Layout,{page:getPage()});
}

function App() {
  return h(AuthProvider,null, h(ToastContainer,null), h(AppContent,null));
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App,null));
</script>
</body>
