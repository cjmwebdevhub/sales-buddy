<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Buddy 3.0</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/static/react.min.js"></script>
  <script src="/static/react-dom.min.js"></script>
  <script src="/static/prop-types.min.js"></script>
  <script src="/static/recharts.min.js"></script>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────────────── */
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Poppins',sans-serif;
      background:#f5f3f8;
      color:#1a0030;
      min-height:100vh;
      background: linear-gradient(135deg,#f5f3f8 0%,#ede9fe 50%,#faf5ff 100%);
      background-attachment:fixed;
    }
    a{color:inherit;text-decoration:none}
    select.input{-webkit-appearance:auto;appearance:auto}
    textarea.input{resize:vertical}

    /* ── Glass Cards ──────────────────────────────────────────────────────── */
    .card{
      background:rgba(255,255,255,0.75);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-radius:.875rem;
      border:1px solid rgba(255,255,255,0.45);
      box-shadow:0 8px 32px rgba(75,0,110,0.10);
      padding:1.25rem;
    }

    /* ── Inputs ───────────────────────────────────────────────────────────── */
    .input{
      width:100%;border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;outline:none;
      background:rgba(255,255,255,0.8);
      border:1px solid rgba(196,181,253,0.7);
      color:#1a0030;font-family:'Poppins',sans-serif;
      backdrop-filter:blur(4px);
    }
    .input:focus{border-color:#4B006E;box-shadow:0 0 0 2px rgba(75,0,110,.18)}

    /* ── Labels & Fields ──────────────────────────────────────────────────── */
    .label{display:block;font-size:.875rem;font-weight:500;color:#3b0764;margin-bottom:.25rem}

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn{padding:.5rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:'Poppins',sans-serif}
    .btn-primary{background:#4B006E;color:#fff;box-shadow:0 2px 8px rgba(75,0,110,.25)}
    .btn-primary:hover{background:#3b0057;box-shadow:0 4px 16px rgba(75,0,110,.35)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .btn-secondary{
      background:rgba(255,255,255,0.7);color:#3b0764;
      border:1px solid rgba(196,181,253,0.6);
      backdrop-filter:blur(4px);
    }
    .btn-secondary:hover{background:rgba(255,255,255,0.95)}
    .btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}

    /* ── Badges ───────────────────────────────────────────────────────────── */
    .badge{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.75rem;font-weight:500}
    .badge-blue{background:#eff6ff;color:#1d4ed8}

    /* ── Tables ───────────────────────────────────────────────────────────── */
    .tbl{width:100%;font-size:.875rem;border-collapse:collapse}
    .tbl th{background:rgba(245,243,248,0.8);text-align:left;font-size:.75rem;font-weight:600;color:#6b21a8;text-transform:uppercase;letter-spacing:.05em;padding:.75rem 1rem;white-space:nowrap}
    .tbl td{padding:.5rem 1rem;border-bottom:1px solid rgba(237,233,254,0.6)}
    .tbl tr:hover td{background:rgba(250,245,255,0.6)}
    .tbl-wrap{overflow-x:auto}
    .tbl-card{padding:0}
    .tbl-empty{text-align:center;padding:2.5rem;color:#94a3b8}

    /* ── Activity Status Badges ───────────────────────────────────────────── */
    .status-done{background:#d1fae5;color:#065f46;display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.75rem;font-weight:500}
    .status-pending{background:#fef3c7;color:#92400e;display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.75rem;font-weight:500}
    .status-call-again{background:#dbeafe;color:#1e40af;display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.75rem;font-weight:500}

    /* ── Toast ────────────────────────────────────────────────────────────── */
    .toast-wrap{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
    .toast{padding:.75rem 1rem;border-radius:.75rem;font-size:.875rem;font-weight:500;animation:fadeIn .3s;max-width:24rem;backdrop-filter:blur(12px)}
    .toast-success{background:rgba(75,0,110,.9);color:#e9d5ff;border:1px solid rgba(255,255,255,.15)}
    .toast-error{background:rgba(153,27,27,.9);color:#fee2e2;border:1px solid rgba(255,255,255,.15)}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-.5rem)}to{opacity:1;transform:translateY(0)}}

    /* ── Modal ────────────────────────────────────────────────────────────── */
    .modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);padding:1rem;backdrop-filter:blur(4px)}
    .modal-box{
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(20px);
      border-radius:1rem;
      border:1px solid rgba(255,255,255,.5);
      box-shadow:0 24px 64px rgba(75,0,110,.2);
      width:100%;max-height:90vh;overflow-y:auto;
    }
    .modal-hd{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid rgba(237,233,254,.6)}
    .modal-bd{padding:1.25rem 1.5rem}
    .modal-actions{display:flex;gap:.75rem}

    /* ── Grid helpers ─────────────────────────────────────────────────────── */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.875rem}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}
    .span2{grid-column:span 2}

    /* ── Gauge ────────────────────────────────────────────────────────────── */
    .gauge-wrap{margin-bottom:.75rem}
    .gauge-bar{height:10px;background:rgba(241,245,249,.9);border-radius:9999px;overflow:hidden}
    .gauge-fill{height:100%;border-radius:9999px;transition:width .3s}

    /* ── App Shell (sidebar + main) ───────────────────────────────────────── */
    .app-shell{display:flex;height:100vh;overflow:hidden}

    /* ── Sidebar ──────────────────────────────────────────────────────────── */
    .sidebar{
      width:15rem;
      background:rgba(75,0,110,0.88);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border-right:1px solid rgba(255,255,255,.1);
      display:flex;flex-direction:column;
      transition:width .2s;flex-shrink:0;overflow:hidden;
      z-index:40;
    }
    .sidebar.collapsed{width:4rem}
    .sidebar-brand{display:flex;align-items:center;gap:.75rem;padding:1rem;border-bottom:1px solid rgba(255,255,255,.12);min-height:4rem}
    .sidebar-logo{height:2rem;width:2rem;border-radius:.375rem;flex-shrink:0;object-fit:cover}
    .sidebar-brand-name{color:#fff;font-weight:700;font-size:.9rem;white-space:nowrap}
    .sidebar-nav{flex:1;overflow-y:auto;padding:.75rem .5rem;display:flex;flex-direction:column;gap:.125rem}
    .sidebar-bottom{padding:.75rem .5rem;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:.125rem}
    .sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.625rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;color:#d8b4fe;transition:background .15s;cursor:pointer;border:none;background:transparent;width:100%;text-align:left}
    .sidebar-link:hover,.sidebar-link.active{background:rgba(107,33,168,.7);color:#fff}
    .sidebar-overlay{display:none}

    /* ── Main area ────────────────────────────────────────────────────────── */
    .main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

    /* ── Topbar ───────────────────────────────────────────────────────────── */
    .topbar{
      background:rgba(255,255,255,0.8);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(233,213,255,.5);
      padding:.75rem 1.5rem;
      display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
    }
    .topbar-menu-btn{background:none;border:none;cursor:pointer;color:#64748b;font-size:1.25rem;padding:.25rem;line-height:1}
    .topbar-user{display:flex;align-items:center;gap:.75rem}
    .topbar-user-info{text-align:right}
    .topbar-user-name{font-size:.875rem;font-weight:600;color:#1a0030}
    .topbar-user-role{font-size:.75rem;color:#6b21a8}
    .topbar-avatar{width:2.5rem;height:2.5rem;border-radius:50%;background:#4B006E;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.875rem}

    /* ── Page content ─────────────────────────────────────────────────────── */
    .page-content{flex:1;overflow-y:auto;padding:1.5rem}
    .page-stack{display:flex;flex-direction:column;gap:1.25rem}
    .page-title{font-size:1.5rem;font-weight:700;color:#0f172a;margin-bottom:.25rem}
    .page-sub{color:#64748b;font-size:.875rem}
    .page-header{display:flex;align-items:center;justify-content:space-between}
    .filter-bar{display:flex;gap:.75rem;flex-wrap:wrap}
    .loading-state{text-align:center;padding:4rem;color:#94a3b8}
    .empty-state{color:#94a3b8;font-size:.875rem}

    /* ── Card helpers ─────────────────────────────────────────────────────── */
    .card-title{font-size:.9375rem;font-weight:600;color:#374151;margin-bottom:1rem}
    .card-header{display:flex;align-items:center;justify-content:space-between}
    .card-actions{display:flex;gap:.75rem;flex-wrap:wrap}

    /* ── Stat cards ───────────────────────────────────────────────────────── */
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
    .stat-card{display:flex;align-items:center;gap:1rem}
    .stat-icon{width:3rem;height:3rem;border-radius:.75rem;background:rgba(237,233,254,.8);display:flex;align-items:center;justify-content:center;color:#4B006E;flex-shrink:0}
    .stat-value{font-size:1.5rem;font-weight:700;color:#0f172a}
    .stat-label{font-size:.875rem;color:#475569}
    .stat-sub{font-size:.75rem;color:#94a3b8}

    /* ── Charts ───────────────────────────────────────────────────────────── */
    .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
    .empty-chart{height:12rem;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:.875rem}

    /* ── Utility cells ────────────────────────────────────────────────────── */
    .mono-cell{font-family:monospace;font-size:.8125rem;color:#64748b}
    .muted-cell{font-size:.8125rem;color:#64748b}
    .notes-cell{color:#64748b;font-size:.8125rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .link-btn{background:none;border:none;color:#4B006E;cursor:pointer;font-size:.8125rem;font-weight:500;font-family:'Poppins',sans-serif}
    .danger-btn{color:#dc2626}
    .breadcrumb{display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:#64748b}

    /* ── Detail view ──────────────────────────────────────────────────────── */
    .detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;font-size:.875rem}
    .detail-label{font-size:.75rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.125rem}
    .detail-value{font-weight:500;color:#374151}

    /* ── Calendar ─────────────────────────────────────────────────────────── */
    .cal-layout{display:grid;grid-template-columns:2fr 1fr;gap:1.5rem}
    .cal-grid-card{}
    .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
    .cal-nav-btn{padding:.375rem .75rem}
    .cal-month-label{font-size:1.125rem;font-weight:600}
    .cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:.5rem}
    .cal-dow{text-align:center;font-size:.75rem;font-weight:600;color:#94a3b8;padding:.25rem}
    .cal-days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
    .cal-day{position:relative;padding:.5rem;border-radius:.5rem;font-size:.875rem;font-weight:500;cursor:pointer;border:none;background:transparent;color:#374151;text-align:center;font-family:'Poppins',sans-serif}
    .cal-day:hover{background:rgba(237,233,254,.5)}
    .cal-today{background:rgba(239,246,255,.8);color:#1d4ed8}
    .cal-sel{background:#4B006E!important;color:#fff!important}
    .cal-dot{position:absolute;bottom:2px;right:3px;width:6px;height:6px;border-radius:50%;background:#4B006E}
    .cal-dot-sel{background:#fff}
    .cal-detail-card{}
    .cal-act-item{padding:.75rem;background:rgba(248,250,252,.8);border-radius:.625rem;margin-bottom:.5rem;font-size:.875rem}

    /* ── Targets ──────────────────────────────────────────────────────────── */
    .targets-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
    .attainment-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;padding-top:.75rem;border-top:1px solid rgba(241,245,249,.8);text-align:center;font-size:.8125rem}

    /* ── Audit trail ──────────────────────────────────────────────────────── */
    .audit-item{padding:.75rem;background:rgba(248,250,252,.8);border-radius:.625rem;margin-bottom:.5rem;font-size:.875rem}

    /* ── Tab bar (Assign page) ────────────────────────────────────────────── */
    .tab-bar{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
    .tab-btn{padding:.5rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;cursor:pointer;border:1px solid rgba(203,213,225,.8);background:rgba(255,255,255,.7);color:#374151;transition:all .15s;font-family:'Poppins',sans-serif}
    .tab-btn.active{border-color:#4B006E;background:#4B006E;color:#fff}

    /* ── Info banners ─────────────────────────────────────────────────────── */
    .info-banner{background:rgba(239,246,255,.9);border-color:rgba(191,219,254,.8)}
    .warn-banner{background:rgba(254,252,232,.9);border-color:rgba(253,230,138,.8)}

    /* ── Uploads ──────────────────────────────────────────────────────────── */
    .uploads-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
    .upload-card-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:1rem}
    .upload-icon{width:2.5rem;height:2.5rem;border-radius:.625rem;background:rgba(237,233,254,.9);display:flex;align-items:center;justify-content:center;color:#4B006E;flex-shrink:0}
    .upload-dropzone{border:2px dashed rgba(233,213,255,.8);border-radius:.75rem;padding:1.25rem;text-align:center;background:rgba(253,252,255,.8);transition:all .15s}
    .upload-dropzone.uploading{border-color:#4B006E;background:rgba(250,245,255,.9)}
    .upload-loading{color:#4B006E;font-size:.875rem;display:flex;align-items:center;justify-content:center;gap:.5rem}
    .upload-result{margin-top:.75rem;padding:.625rem;border-radius:.5rem;font-size:.8125rem;display:flex;align-items:center;gap:.5rem}
    .result-ok{background:rgba(240,253,244,.9);color:#166534}
    .result-err{background:rgba(254,242,242,.9);color:#991b1b}

    /* ── Promos ───────────────────────────────────────────────────────────── */
    .promos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
    .promo-card-header{display:flex;justify-content:space-between;margin-bottom:.75rem}

    /* ── Profile ──────────────────────────────────────────────────────────── */
    .profile-header{display:flex;align-items:center;gap:1.25rem;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:1px solid rgba(241,245,249,.8)}
    .profile-avatar{width:5rem;height:5rem;border-radius:50%;background:#4B006E;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:700;flex-shrink:0}
    .profile-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;font-size:.875rem}
    .profile-edit-form{display:flex;flex-direction:column;gap:.875rem;padding-top:1.25rem;border-top:1px solid rgba(241,245,249,.8)}
    .profile-notice{margin-top:1.25rem;padding:.75rem;background:rgba(239,246,255,.9);border-radius:.625rem;font-size:.8125rem;color:#1e3a8a}

    /* ── Register card ────────────────────────────────────────────────────── */
    .register-card{width:100%;max-width:520px;padding:2rem}

    /* ── Auth split layout ────────────────────────────────────────────────── */
    .auth-split{min-height:100vh;display:flex;font-family:'Poppins',sans-serif}
    .auth-left{flex:1;background:linear-gradient(160deg,#4B006E 0%,#2d0042 60%,#1a0030 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;color:#fff;position:relative;overflow:hidden}
    .auth-left-inner{position:relative;z-index:1;text-align:center;max-width:26rem}
    .auth-logo{height:120px;border-radius:1.25rem;margin-bottom:2rem;box-shadow:0 8px 32px rgba(0,0,0,.3)}
    .auth-left-title{font-size:1.75rem;font-weight:700;margin-bottom:.75rem;line-height:1.3}
    .auth-left-sub{font-size:.95rem;color:rgba(255,255,255,.7);line-height:1.7}
    .auth-features{display:flex;flex-direction:column;gap:.6rem;margin-top:2rem;text-align:left}
    .auth-feature-row{display:flex;align-items:center;gap:.75rem;font-size:.875rem;color:rgba(255,255,255,.8)}
    .auth-left-footer{position:absolute;bottom:1.5rem;font-size:.7rem;color:rgba(255,255,255,.35);letter-spacing:.05em;text-transform:uppercase}
    .auth-right{width:460px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);padding:3rem 2.5rem}
    .auth-form-wrap{width:100%;max-width:360px}
    .auth-form-header{margin-bottom:2.25rem}
    .auth-form-title{font-size:1.75rem;font-weight:700;color:#1a0030;margin-bottom:.375rem}
    .auth-form-sub{font-size:.9rem;color:#6b21a8;font-weight:400}
    .auth-form{display:flex;flex-direction:column;gap:1.1rem}
    .auth-field-label{display:block;font-size:.8rem;font-weight:600;color:#3b0764;margin-bottom:.375rem;letter-spacing:.03em;text-transform:uppercase}
    .auth-input{padding:.75rem 1rem;font-size:.9rem}
    .auth-submit{width:100%;padding:.875rem;font-size:1rem;margin-top:.25rem;border-radius:.625rem;letter-spacing:.02em}
    .auth-demo-box{margin-top:1.75rem;padding:.875rem 1rem;background:rgba(250,245,255,.9);border-radius:.625rem;font-size:.75rem;color:#3b0764;border:1px solid rgba(233,213,255,.7);line-height:1.8}
    .auth-demo-title{font-weight:600;margin-bottom:.2rem;font-size:.8rem}
    .auth-switch{text-align:center;font-size:.875rem;color:#6b21a8;margin-top:1.5rem}

    /* ── Landing Page ─────────────────────────────────────────────────────── */
    .landing-root{min-height:100vh;background:transparent}
    .landing-hero{background:linear-gradient(135deg,#4B006E 0%,#2d0042 55%,#1a0030 100%);padding:4rem 2rem 3.5rem;text-align:center;color:#fff}
    .landing-hero-inner{max-width:680px;margin:0 auto}
    .landing-logo{height:110px;border-radius:1.25rem;margin-bottom:1.5rem;box-shadow:0 12px 40px rgba(0,0,0,.35)}
    .landing-headline{font-size:2.5rem;font-weight:800;margin-bottom:.5rem;line-height:1.15}
    .landing-tagline{font-size:1.05rem;color:rgba(255,255,255,.75);margin-bottom:1.5rem;line-height:1.7}
    .landing-datetime{display:flex;flex-direction:column;gap:.15rem;font-size:.875rem;color:rgba(255,255,255,.6);margin-bottom:2rem}
    .landing-time{font-size:1.5rem;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:.04em}
    .landing-ctas{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
    .landing-cta-primary{padding:.875rem 2.5rem;font-size:1rem;border-radius:.625rem}
    .landing-cta-ghost{background:rgba(255,255,255,.12);color:#fff;padding:.875rem 2.5rem;border-radius:.625rem;font-size:1rem;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.3);font-family:'Poppins',sans-serif;transition:background .15s}
    .landing-cta-ghost:hover{background:rgba(255,255,255,.22)}
    .landing-section{padding:3rem 2rem;max-width:900px;margin:0 auto}
    .landing-section-alt{background:transparent}
    .landing-section-title{font-size:1.5rem;font-weight:700;color:#1a0030;margin-bottom:1.5rem;text-align:center}
    .landing-features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.25rem}
    .landing-feature-card{background:rgba(255,255,255,0.75);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.45);border-radius:.875rem;padding:1.25rem;box-shadow:0 4px 16px rgba(75,0,110,.07)}
    .landing-feature-icon{margin-bottom:.75rem}
    .landing-feature-title{font-weight:600;font-size:1rem;margin-bottom:.375rem;color:#1a0030}
    .landing-feature-desc{font-size:.875rem;color:#475569;line-height:1.6}
    .landing-roles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem}
    .landing-role-card{background:rgba(255,255,255,0.75);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.45);border-radius:.875rem;padding:1.25rem;text-align:center;box-shadow:0 4px 16px rgba(75,0,110,.07)}
    .landing-role-badge{display:inline-block;background:#4B006E;color:#e9d5ff;padding:.2rem .8rem;border-radius:9999px;font-size:.875rem;font-weight:700;margin-bottom:.5rem}
    .landing-role-label{font-weight:600;color:#1a0030;font-size:.9375rem;margin-bottom:.375rem}
    .landing-role-desc{font-size:.8125rem;color:#64748b;line-height:1.6}
    .landing-footer{background:rgba(75,0,110,.07);border-top:1px solid rgba(75,0,110,.12);padding:1.5rem 2rem}
    .landing-footer-inner{display:flex;align-items:center;gap:1rem;max-width:900px;margin:0 auto}
    .landing-footer-logo{height:2.5rem;border-radius:.5rem}
    .landing-footer-brand{font-weight:700;color:#1a0030;font-size:.9375rem}
    .landing-footer-sub{font-size:.8125rem;color:#64748b}

    /* ── Mobile bottom tab bar ────────────────────────────────────────────── */
    .mobile-tabbar{display:none}

    /* ──────────────────────────────────────────────────────────────────────
       RESPONSIVE — mobile ≤768px
    ────────────────────────────────────────────────────────────────────── */
    @media(max-width:768px){
      /* Sidebar hidden on mobile, replaced by tab bar */
      .sidebar{
        position:fixed;top:0;left:0;bottom:0;
        transform:translateX(-100%);
        transition:transform .25s;
        width:15rem!important;
      }
      .sidebar.mobile-open{transform:translateX(0)}
      .sidebar-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}

      /* Main area fills the screen, leaves room for tab bar */
      .main-area{padding-bottom:4.5rem}
      .page-content{padding:1rem}

      /* Bottom tab bar */
      .mobile-tabbar{
        display:flex;position:fixed;bottom:0;left:0;right:0;
        background:rgba(255,255,255,.92);backdrop-filter:blur(16px);
        border-top:1px solid rgba(233,213,255,.6);
        z-index:40;padding:.25rem 0 .25rem;
      }
      .mobile-tab{
        flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:.15rem;padding:.5rem .25rem;border:none;background:transparent;
        cursor:pointer;color:#64748b;font-family:'Poppins',sans-serif;
      }
      .mobile-tab.active{color:#4B006E}
      .mobile-tab-label{font-size:.6rem;font-weight:500;white-space:nowrap}

      /* Grids → single column */
      .grid2{grid-template-columns:1fr}
      .grid3{grid-template-columns:1fr}
      .span2{grid-column:span 1}
      .chart-grid{grid-template-columns:1fr}
      .cal-layout{grid-template-columns:1fr}
      .detail-grid{grid-template-columns:1fr 1fr}
      .profile-info-grid{grid-template-columns:1fr}

      /* Auth split → stack vertically */
      .auth-split{flex-direction:column}
      .auth-left{padding:2rem 1.5rem;flex:none}
      .auth-logo{height:80px}
      .auth-right{width:100%;padding:2rem 1.5rem}

      /* Landing */
      .landing-hero{padding:3rem 1.25rem 2.5rem}
      .landing-headline{font-size:1.75rem}
      .landing-section{padding:2rem 1.25rem}

      /* Topbar */
      .topbar{padding:.625rem 1rem}
      .topbar-user-info{display:none}
    }

    @media(max-width:480px){
      .stat-grid{grid-template-columns:1fr 1fr}
      .landing-roles-grid{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
